<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EMBERSECT — Xianxia Tower Defense</title>
  <style>
    body {
      margin: 0;
      background: #060813;
      color: #ffb347;
      font-family: monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #game-container {
      position: relative;
      width: 1280px;
      height: 720px;
      box-shadow: 0 0 40px rgba(255, 122, 26, 0.25);
      background: #0b1026;
      border: 2px solid #2f3868;
    }
    canvas {
      display: block;
      width: 1280px;
      height: 720px;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      font-size: 16px;
      text-shadow: 0 0 8px rgba(255, 179, 71, 0.6);
    }
    .hud-group {
      display: flex;
      gap: 18px;
    }
    .hud-item span {
      color: #ffffff;
      font-weight: bold;
    }
    #boss-bar-container {
      position: absolute;
      bottom: 15px;
      left: 340px;
      width: 600px;
      height: 16px;
      background: rgba(11, 16, 38, 0.85);
      border: 2px solid #ba55d3;
      border-radius: 4px;
      display: none;
      overflow: hidden;
    }
    #boss-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ba55d3, #ff7a1a);
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="hud">
      <div class="hud-group">
        <div class="hud-item">NIGHT: <span id="night">1</span>/10</div>
        <div class="hud-item">WAVE: <span id="wave">1</span></div>
        <div class="hud-item">SPIRIT STONES: <span id="stones">120</span></div>
        <div class="hud-item">FORMATION: <span id="formation-level">1</span></div>
      </div>
      <div class="hud-group">
        <div class="hud-item">ALTAR: <span id="altar">20</span>/20</div>
        <div class="hud-item">SCORE: <span id="score">0</span></div>
      </div>
    </div>
    <div id="boss-bar-container">
      <div id="boss-bar"></div>
    </div>
  </div>
  <div style="margin-top: 8px; font-size: 13px; color: #7fd4ff; text-align: center;">Click anywhere to enable sound (Press M to mute/unmute)</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
